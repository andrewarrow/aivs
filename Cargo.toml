[package]
name = "aivs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"
description = "Native Rust workspace for local AI video generation and Codex"

[workspace]
members = ["crates/aivs-core"]
resolver = "3"

[dependencies]
aivs-core = { path = "crates/aivs-core" }
egui = "0.35"
egui-wgpu = { version = "0.35", features = ["winit"] }
egui-winit = "0.35"
image = { version = "0.25.10", default-features = false, features = ["png"] }
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
serde_json = "1"
tempfile = "3"
url = "2"
webbrowser = "1"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "NSDockTile", "NSGraphics", "NSMenu", "NSMenuItem", "NSCell", "NSEvent"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL", "NSGeometry", "NSError", "NSObject", "NSPathUtilities"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
