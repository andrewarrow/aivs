[package]
name = "aivs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"
description = "Headless AIVS production rules and worker protocol"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "aivs-engine"
path = "src/main.rs"
