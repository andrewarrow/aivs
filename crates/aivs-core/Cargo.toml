[package]
name = "aivs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"
description = "Headless AIVS production rules and worker protocol"

[dependencies]
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "aivs-engine"
path = "src/main.rs"
